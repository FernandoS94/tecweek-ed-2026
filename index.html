<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecWeek ED 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0714;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem 1.5rem;
    }

    /* Resplandor holográfico/púrpura de fondo */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(123, 31, 162, 0.4) 0%, rgba(106, 27, 154, 0.15) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Tag superior */
    .badge {
      font-size: 0.8rem;
      letter-spacing: 3px;
      font-weight: 700;
      color: #e0b0ff;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .gcba {
      font-size: 0.75rem;
      letter-spacing: 4px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 2.5rem;
    }

    /* Bloque isotipo/logo */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.88;
      margin-bottom: 2.5rem;
    }

    .logo-tec {
      font-size: 4.8rem;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: lowercase;
    }

    .logo-week {
      font-size: 4.8rem;
      font-weight: 300;
      letter-spacing: -2px;
      text-transform: lowercase;
      color: #eaeaea;
    }

    .logo-ed {
      font-size: 5.4rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, #bb86fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0.15rem;
    }

    .logo-ba {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #f3e5f5;
      margin-top: 1rem;
    }

    /* Ubicación */
    .venue {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .location {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }

    /* Hashtag final */
    .hashtag {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #d18ff0;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <main class="card">
    <div class="badge">EDICIÓN 2026</div>
    <div class="gcba">GCBA</div>

    <div class="logo-block">
      <span class="logo-tec">tec</span>
      <span class="logo-week">week</span>
      <span class="logo-ed">ED</span>
      <span class="logo-ba">BUENOS AIRES</span>
    </div>

    <div class="venue">Usina del Arte</div>
    <div class="location">CABA, Argentina</div>

    <div class="hashtag">#TecWeekED</div>
  </main>

</body>
</html>
